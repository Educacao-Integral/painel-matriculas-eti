<script>
'use strict';const D=JSON.parse(document.getElementById('public-data').textContent);const fmt=new Intl.NumberFormat('pt-BR');const pct=x=>Number.isFinite(+x)?(+x).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%':'—';const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9]+/g,' ').trim();const fd=d=>{const a=String(d||'').split('-');return a.length===3?`${a[2]}/${a[1]}/${a[0]}`:d};
document.getElementById('lastUpdate').textContent='Atualizado em '+fd(D.updatedAt);document.getElementById('validationPill').textContent=D.validation.unknownTurmas?'Atenção: classificação pendente em '+D.validation.unknownTurmas+' turmas':'Base validada sem séries pendentes';
const T=[['dashboard','Visão Geral'],['escolas','Escolas'],['enturmacao','Enturmação'],['ocupacao','Ocupação'],['ept','EPT / Cursos'],['jornada','Jornada Ampliada'],['regionais','Regionais'],['historico','Histórico'],['metodologia','Metodologia']];let active='dashboard';function nav(){document.getElementById('nav').innerHTML=T.map(([id,n])=>`<button class="${active===id?'active':''}" data-id="${id}">${n}</button>`).join('');document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>show(b.dataset.id))}function show(id){active=id;document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));document.getElementById('p-'+id).classList.add('active');nav();scrollTo({top:0,behavior:'smooth'})}
function bars(items,key='estudantes',label='escola',n=10){const a=[...items].sort((x,y)=>y[key]-x[key]).slice(0,n),mx=Math.max(1,...a.map(x=>x[key]));return a.map((x,i)=>`<div class="barrow"><span title="${esc(x[label])}">${i+1}. ${esc(String(x[label]).length>34?String(x[label]).slice(0,34)+'…':x[label])}</span><div class="bar"><i style="width:${100*x[key]/mx}%"></i></div><b class="num">${fmt.format(x[key])}</b></div>`).join('')}
function lineChart(hist){const pts=[...hist].filter(x=>x.totalE>0).sort((a,b)=>a.date.localeCompare(b.date));if(pts.length<2)return'<div class="muted">Histórico insuficiente.</div>';const W=800,H=220,p=32,min=Math.min(...pts.map(x=>x.totalE)),max=Math.max(...pts.map(x=>x.totalE)),rg=Math.max(1,max-min),c=pts.map((x,i)=>[p+i*(W-2*p)/(pts.length-1),H-p-(x.totalE-min)*(H-2*p)/rg]);const path=c.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><line x1="${p}" y1="${H-p}" x2="${W-p}" y2="${H-p}" stroke="#ccd8d1"/><path d="${path}" fill="none" stroke="#1b7447" stroke-width="3" vector-effect="non-scaling-stroke"/>${c.map((q,i)=>`<circle cx="${q[0]}" cy="${q[1]}" r="4" fill="#1b7447"><title>${fd(pts[i].date)}: ${fmt.format(pts[i].totalE)}</title></circle>`).join('')}</svg></div><div class="chartlabels"><span>Mínimo: ${fmt.format(min)}</span><span>Máximo: ${fmt.format(max)}</span><span>Atual: ${fmt.format(pts.at(-1).totalE)}</span></div>`}
function renderDashboard(){const n=D.network,s=D.snapshot,j=D.jornada,schools=D.schools,regs=D.regionals;document.getElementById('p-dashboard').innerHTML=`<div class="kpis"><div class="kpi"><div class="lab">Matrículas na rede</div><div class="val">${fmt.format(n.estudantes)}</div><div class="sub">${fmt.format(n.escolas)} escolas no Mapa</div></div><div class="kpi"><div class="lab">Tempo integral</div><div class="val">${fmt.format(s.totalE)}</div><div class="sub">${pct(100*s.totalE/n.estudantes)} da rede</div></div><div class="kpi"><div class="lab">Turmas integrais</div><div class="val">${fmt.format(s.totalT)}</div><div class="sub">contagem direta</div></div><div class="kpi"><div class="lab">Vagas ETI</div><div class="val">${fmt.format(Math.max(0,n.integralCapacidade-n.integralEstudantes))}</div><div class="sub">ocupação ${pct(100*n.integralEstudantes/n.integralCapacidade)}</div></div><div class="kpi"><div class="lab">EPT integral</div><div class="val">${fmt.format(s.eptE)}</div><div class="sub">${fmt.format(s.eptT)} turmas</div></div><div class="kpi"><div class="lab">Jornada ampliada</div><div class="val">${fmt.format(j.estudantes)}</div><div class="sub">${fmt.format(j.turmas)} turmas · ${fmt.format(j.escolas)} escolas</div></div></div><div class="summary"><div><span class="muted">EF1 integral</span><b>${fmt.format(s.ef1E)}</b><span class="muted">${fmt.format(s.ef1T)} turmas</span></div><div><span class="muted">EF2 integral</span><b>${fmt.format(s.ef2E)}</b><span class="muted">${fmt.format(s.ef2T)} turmas</span></div><div><span class="muted">Ensino Médio</span><b>${fmt.format(s.emE)}</b><span class="muted">${fmt.format(s.emT)} turmas · inclui EPT</span></div><div><span class="muted">Escolas integrais</span><b>${fmt.format(n.integralEscolas)}</b><span class="muted">identificadas no mapa atual</span></div></div><div style="height:14px"></div><div class="grid2"><div class="card"><h3>Superintendências Regionais</h3><div class="tablewrap"><table><thead><tr><th>SRE</th><th class="num">Escolas</th><th class="num">Turmas</th><th class="num">ETI</th><th class="num">Ocupação</th><th class="num">Jornada</th></tr></thead><tbody>${regs.map(x=>`<tr><td><b>${esc(x.sre)}</b></td><td class="num">${fmt.format(x.escolas)}</td><td class="num">${fmt.format(x.turmas)}</td><td class="num">${fmt.format(x.estudantes)}</td><td class="num">${pct(x.ocupacao)}</td><td class="num">${fmt.format(x.jornada)}</td></tr>`).join('')}</tbody></table></div></div><div class="card"><h3>Maiores matrículas em tempo integral</h3>${bars(schools.map(x=>({...x,estudantes:x.total.e})),'estudantes','escola',10)}</div></div>`}
function filterControls(prefix,withMunicipio=true){const sres=[...new Set(D.schools.map(x=>x.sre))].sort((a,b)=>a.localeCompare(b,'pt-BR'));const mun=[...new Set(D.schools.map(x=>x.municipio))].sort((a,b)=>a.localeCompare(b,'pt-BR'));return `<div class="filters"><input id="${prefix}-q" placeholder="Buscar escola, município ou INEP…"><select id="${prefix}-sre"><option value="">Todas as SRE</option>${sres.map(x=>`<option>${esc(x)}</option>`).join('')}</select>${withMunicipio?`<select id="${prefix}-mun"><option value="">Todos os municípios</option>${mun.map(x=>`<option>${esc(x)}</option>`).join('')}</select>`:''}<button class="clear" id="${prefix}-clear">Limpar</button></div>`}
function filtered(prefix,arr=D.schools){const q=norm(document.getElementById(prefix+'-q')?.value),s=document.getElementById(prefix+'-sre')?.value||'',m=document.getElementById(prefix+'-mun')?.value||'';return arr.filter(x=>(!s||x.sre===s)&&(!m||x.municipio===m)&&(!q||norm([x.escola,x.municipio,x.inep].join(' ')).includes(q)))}function wire(prefix,draw){['q','sre','mun'].forEach(k=>document.getElementById(prefix+'-'+k)?.addEventListener('input',draw));document.getElementById(prefix+'-clear')?.addEventListener('click',()=>{['q','sre','mun'].forEach(k=>{const e=document.getElementById(prefix+'-'+k);if(e)e.value=''});draw()})}
function renderEscolas(){const p=document.getElementById('p-escolas');p.innerHTML=`<div class="sectionhead"><div><h2>Escolas integrais</h2><div class="muted">Consulta consolidada por unidade escolar.</div></div></div>${filterControls('esc')}<div id="esc-t"></div>`;function draw(){const a=filtered('esc');document.getElementById('esc-t').innerHTML=`<div class="tablewrap tall"><table><thead><tr><th>SRE</th><th>Município</th><th>INEP</th><th class="school">Escola</th><th>Etapas</th><th class="num">Turmas</th><th class="num">Estudantes</th><th class="num">Capacidade</th><th class="num">Vagas</th><th class="num">Ocupação</th></tr></thead><tbody>${a.map(x=>`<tr><td>${esc(x.sre)}</td><td>${esc(x.municipio)}</td><td>${esc(x.inep)}</td><td class="school"><b>${esc(x.escola)}</b></td><td><span class="badge">${esc(x.etapas)}</span></td><td class="num">${fmt.format(x.total.t)}</td><td class="num"><b>${fmt.format(x.total.e)}</b></td><td class="num">${fmt.format(x.capacidade)}</td><td class="num">${fmt.format(x.disponivel)}</td><td class="num"><span class="badge ${x.ocupacao>100?'red':x.ocupacao>=95?'warn':''}">${pct(x.ocupacao)}</span></td></tr>`).join('')}</tbody></table></div><div class="muted" style="margin-top:8px">${fmt.format(a.length)} escolas exibidas</div>`}draw();wire('esc',draw)}
const pk=(x,k)=>{const v=x.metrics[k]||{t:0,e:0};return `${fmt.format(v.t)} / ${fmt.format(v.e)}`};function renderEnturmacao(){const p=document.getElementById('p-enturmacao');p.innerHTML=`<div class="sectionhead"><div><h2>Enturmação</h2><div class="muted">T/E = turmas / estudantes.</div></div></div>${filterControls('ent')}<div id="ent-t"></div>`;function draw(){const a=filtered('ent');document.getElementById('ent-t').innerHTML=`<div class="mobile-note notice">No celular, deslize a tabela horizontalmente para consultar todas as séries.</div><div class="tablewrap tall"><table><thead><tr><th>SRE</th><th>Município</th><th class="school">Escola</th><th>4º T/E</th><th>5º T/E</th><th>6º T/E</th><th>7º T/E</th><th>8º T/E</th><th>9º T/E</th><th>1ª T/E</th><th>1ª EPT</th><th>2ª T/E</th><th>2ª EPT</th><th>3ª T/E</th><th>3ª EPT</th><th>EM T/E</th><th>Total T/E</th></tr></thead><tbody>${a.map(x=>`<tr><td>${esc(x.sre)}</td><td>${esc(x.municipio)}</td><td class="school"><b>${esc(x.escola)}</b></td><td class="num">${pk(x,'EF1_4')}</td><td class="num">${pk(x,'EF1_5')}</td><td class="num">${pk(x,'EF2_6')}</td><td class="num">${pk(x,'EF2_7')}</td><td class="num">${pk(x,'EF2_8')}</td><td class="num">${pk(x,'EF2_9')}</td><td class="num">${pk(x,'EM_1')}</td><td class="num">${pk(x,'EPT_1')}</td><td class="num">${pk(x,'EM_2')}</td><td class="num">${pk(x,'EPT_2')}</td><td class="num">${pk(x,'EM_3')}</td><td class="num">${pk(x,'EPT_3')}</td><td class="num"><b>${fmt.format(x.em.t)} / ${fmt.format(x.em.e)}</b></td><td class="num"><b>${fmt.format(x.total.t)} / ${fmt.format(x.total.e)}</b></td></tr>`).join('')}</tbody></table></div>`}draw();wire('ent',draw)}
function renderOcupacao(){const p=document.getElementById('p-ocupacao');p.innerHTML=`<div class="sectionhead"><div><h2>Ocupação e vagas</h2><div class="muted">Capacidade e estudantes cursando nas turmas de turno Integral.</div></div></div>${filterControls('ocu')}<div id="ocu-t"></div>`;function draw(){const a=filtered('ocu').sort((x,y)=>y.ocupacao-x.ocupacao);document.getElementById('ocu-t').innerHTML=`<div class="tablewrap tall"><table><thead><tr><th>SRE</th><th>Município</th><th class="school">Escola</th><th class="num">Cursando</th><th class="num">Capacidade</th><th class="num">Vagas</th><th class="num">Ocupação</th></tr></thead><tbody>${a.map(x=>`<tr><td>${esc(x.sre)}</td><td>${esc(x.municipio)}</td><td class="school"><b>${esc(x.escola)}</b></td><td class="num">${fmt.format(x.cursando)}</td><td class="num">${fmt.format(x.capacidade)}</td><td class="num">${fmt.format(x.disponivel)}</td><td class="num"><span class="badge ${x.ocupacao>100?'red':x.ocupacao>=95?'warn':''}">${pct(x.ocupacao)}</span></td></tr>`).join('')}</tbody></table></div>`}draw();wire('ocu',draw)}
function renderEPT(){const p=document.getElementById('p-ept'),rows=D.eptRows;p.innerHTML=`<div class="sectionhead"><div><h2>EPT / Cursos</h2><div class="muted">${fmt.format(rows.length)} turmas · ${fmt.format(rows.reduce((a,x)=>a+x.cursando,0))} estudantes.</div></div></div><div class="filters"><input id="ept-q" placeholder="Buscar escola, município, turma ou série…"><select id="ept-sre"><option value="">Todas as SRE</option>${[...new Set(rows.map(x=>x.sre))].sort().map(x=>`<option>${esc(x)}</option>`).join('')}</select><span></span><button class="clear" id="ept-clear">Limpar</button></div><div id="ept-t"></div>`;function draw(){const q=norm(document.getElementById('ept-q').value),s=document.getElementById('ept-sre').value,a=rows.filter(x=>(!s||x.sre===s)&&(!q||norm([x.escola,x.municipio,x.turma,x.serie,x.composicao].join(' ')).includes(q)));document.getElementById('ept-t').innerHTML=`<div class="tablewrap tall"><table><thead><tr><th>SRE</th><th>Município</th><th class="school">Escola</th><th>Turma</th><th>Série</th><th>Composição</th><th class="num">Cursando</th><th class="num">Capacidade</th><th class="num">Vagas</th></tr></thead><tbody>${a.map(x=>`<tr><td>${esc(x.sre)}</td><td>${esc(x.municipio)}</td><td class="school"><b>${esc(x.escola)}</b></td><td>${esc(x.turma)}</td><td>${esc(x.serie)}</td><td>${esc(x.composicao)}</td><td class="num">${fmt.format(x.cursando)}</td><td class="num">${fmt.format(x.capacidade)}</td><td class="num">${fmt.format(x.disponivel)}</td></tr>`).join('')}</tbody></table></div>`}draw();['ept-q','ept-sre'].forEach(id=>document.getElementById(id).oninput=draw);document.getElementById('ept-clear').onclick=()=>{document.getElementById('ept-q').value='';document.getElementById('ept-sre').value='';draw()}}
function renderJornada(){const p=document.getElementById('p-jornada'),rows=D.jornadaSchools;p.innerHTML=`<div class="sectionhead"><div><h2>Jornada Ampliada</h2><div class="muted">${fmt.format(D.jornada.estudantes)} estudantes · ${fmt.format(D.jornada.turmas)} turmas · ${fmt.format(D.jornada.escolas)} escolas.</div></div></div><div class="filters"><input id="jor-q" placeholder="Buscar escola ou município…"><select id="jor-sre"><option value="">Todas as SRE</option>${[...new Set(rows.map(x=>x.sre))].sort().map(x=>`<option>${esc(x)}</option>`).join('')}</select><span></span><button class="clear" id="jor-clear">Limpar</button></div><div id="jor-t"></div>`;function draw(){const q=norm(document.getElementById('jor-q').value),s=document.getElementById('jor-sre').value,a=rows.filter(x=>(!s||x.sre===s)&&(!q||norm([x.escola,x.municipio,x.inep].join(' ')).includes(q)));document.getElementById('jor-t').innerHTML=`<div class="tablewrap tall"><table><thead><tr><th>SRE</th><th>Município</th><th>INEP</th><th class="school">Escola</th><th class="num">Turmas</th><th class="num">Estudantes</th><th class="num">Capacidade</th><th class="num">Ocupação</th><th>Modelos</th></tr></thead><tbody>${a.map(x=>`<tr><td>${esc(x.sre)}</td><td>${esc(x.municipio)}</td><td>${esc(x.inep)}</td><td class="school"><b>${esc(x.escola)}</b></td><td class="num">${fmt.format(x.turmas)}</td><td class="num"><b>${fmt.format(x.estudantes)}</b></td><td class="num">${fmt.format(x.capacidade)}</td><td class="num">${pct(x.ocupacao)}</td><td>${x.modelos.map(m=>`<span class="badge">${esc(m.modelo)}: ${fmt.format(m.estudantes)}</span>`).join(' ')}</td></tr>`).join('')}</tbody></table></div>`}draw();['jor-q','jor-sre'].forEach(id=>document.getElementById(id).oninput=draw);document.getElementById('jor-clear').onclick=()=>{document.getElementById('jor-q').value='';document.getElementById('jor-sre').value='';draw()}}
function renderRegionais(){const a=D.regionals;document.getElementById('p-regionais').innerHTML=`<div class="sectionhead"><div><h2>Resumo por Regional</h2><div class="muted">Matrículas, turmas, capacidade e Jornada Ampliada.</div></div></div><div class="grid2"><div class="card"><div class="tablewrap"><table><thead><tr><th>SRE</th><th class="num">Escolas</th><th class="num">Turmas</th><th class="num">ETI</th><th class="num">Capacidade</th><th class="num">Ocupação</th><th class="num">Jornada</th></tr></thead><tbody>${a.map(x=>`<tr><td><b>${esc(x.sre)}</b></td><td class="num">${fmt.format(x.escolas)}</td><td class="num">${fmt.format(x.turmas)}</td><td class="num">${fmt.format(x.estudantes)}</td><td class="num">${fmt.format(x.capacidade)}</td><td class="num">${pct(x.ocupacao)}</td><td class="num">${fmt.format(x.jornada)}</td></tr>`).join('')}</tbody></table></div></div><div class="card"><h3>Regionais com mais estudantes ETI</h3>${bars(a,'estudantes','sre',12)}</div></div>`}
function renderHistorico(){const h=D.history;document.getElementById('p-historico').innerHTML=`<div class="sectionhead"><div><h2>Histórico</h2><div class="muted">Evolução das matrículas em tempo integral.</div></div></div><div class="card"><h3>Total de estudantes integrais</h3>${lineChart(h)}</div><div class="tablewrap"><table><thead><tr><th>Data</th><th>Origem</th><th class="num">EF1 T/E</th><th class="num">EF2 T/E</th><th class="num">EPT T/E</th><th class="num">EM T/E</th><th class="num">Geral T/E</th></tr></thead><tbody>${h.map(x=>`<tr><td>${fd(x.date)}</td><td>${esc(x.label||'')}</td><td class="num">${fmt.format(x.ef1T)} / ${fmt.format(x.ef1E)}</td><td class="num">${fmt.format(x.ef2T)} / ${fmt.format(x.ef2E)}</td><td class="num">${fmt.format(x.eptT)} / ${fmt.format(x.eptE)}</td><td class="num">${fmt.format(x.emT)} / ${fmt.format(x.emE)}</td><td class="num"><b>${fmt.format(x.totalT)} / ${fmt.format(x.totalE)}</b></td></tr>`).join('')}</tbody></table></div>`}
function renderMetodologia(){const m=D.methodology,v=D.validation;document.getElementById('p-metodologia').innerHTML=`<div class="sectionhead"><div><h2>Metodologia e transparência</h2><div class="muted">Como os indicadores deste painel são calculados.</div></div></div><div class="card"><div class="notice"><b>Privacidade</b><br>${esc(m.privacy)}</div><h3>Critérios de classificação</h3><p><b>Tempo integral:</b> ${esc(m.integral)}</p><p><b>Ensino Fundamental I:</b> ${esc(m.ef1)}</p><p><b>Ensino Fundamental II:</b> ${esc(m.ef2)}</p><p><b>Ensino Médio:</b> ${esc(m.em)}</p><p><b>EPT:</b> ${esc(m.ept)}</p><p><b>Atualização:</b> ${fd(D.updatedAt)}.</p>${v.unknownTurmas?`<div class="notice warning"><b>Validação:</b> há ${fmt.format(v.unknownTurmas)} turmas / ${fmt.format(v.unknownEstudantes)} estudantes em classificações não reconhecidas pelas regras atuais. Elas são sinalizadas para revisão antes da próxima atualização.</div>`:`<div class="notice"><b>Validação:</b> todas as turmas integrais da base atual foram enquadradas nas regras do painel.</div>`}</div>`}
async function sharePage(){const data={title:document.title,text:'Painel de Matrículas — Educação em Tempo Integral',url:location.href};try{if(navigator.share)await navigator.share(data);else{await navigator.clipboard.writeText(location.href);alert('Link copiado para a área de transferência.')}}catch(e){}}
renderDashboard();renderEscolas();renderEnturmacao();renderOcupacao();renderEPT();renderJornada();renderRegionais();renderHistorico();renderMetodologia();nav();
</script></body></html>
