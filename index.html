 #print-report .chart{height:55mm;break-inside:avoid}

<script>
function buildNetworkSchools(rows, referenceSchools) {
  const refs = new Map(referenceSchools.map(x => [String(x.inep), x]));
  const schools = new Map();
  const classifyNetwork = r => {
    const s = norm(r[7]), c = norm(r[8]);
    for (const n of [4,5,6,7,8,9]) if (s === n+' ANO') return (n<6?'EF1_':'EF2_')+n;
    if(c==='ENSINO FUNDAMENTAL ANOS FINAIS CICLO SEQUENCIAL DE CORRECAO DE FLUXO II') return 'EF2_FLOW';
    for(const n of [1,2,3]) if(s.startsWith(n+' SERIE')&&(s.endsWith(' IN')||s.includes('1 SEM')||s.includes('2 SEM'))) return 'EPT_'+n;
    for(const n of [1,2,3]) if(s===n+' SERIE') return 'EM_'+n;
    if(c==='ENSINO MEDIO CICLO SEQUENCIAL DE CORRECAO DE FLUXO III') return 'EM_FLOW';
    return 'OUTRAS';
  };
  for(const r of rows) {
    const inep=String(r[0]??'');
    if(!schools.has(inep)) {
      const ref=refs.get(inep)||{};
      schools.set(inep,{inep,sre:r[1]||'',municipio:r[2]||'',escola:r[3]||'',implantacao:ref.implantacao||'',programa:ref.programa||'',turnos:[]});
    }
    const school=schools.get(inep), turno=String(r[9]||'Não informado');
    let t=school.turnos.find(x=>x.turno===turno);
    if(!t){t={turno,metrics:{},total:{t:0,e:0},em:{t:0,e:0},cursando:0,capacidade:0,etapas:[]};school.turnos.push(t);}
    const e=Number(r[10])||0, cap=Number(r[11])||0, k=classifyNetwork(r);
    if(!t.metrics[k])t.metrics[k]={t:0,e:0};t.metrics[k].t++;t.metrics[k].e+=e;
    t.total.t++;t.total.e+=e;t.cursando+=e;t.capacidade+=cap;
    if(k.startsWith('EM_')||k.startsWith('EPT_')){t.em.t++;t.em.e+=e;}
    const etapa=String(r[8]||r[7]||'Não informado');if(!t.etapas.includes(etapa))t.etapas.push(etapa);
  }
  return [...schools.values()].sort((a,b)=>a.sre.localeCompare(b.sre,'pt-BR')||a.municipio.localeCompare(b.municipio,'pt-BR')||a.escola.localeCompare(b.escola,'pt-BR'));
}

function selectSchoolTurn(school, turno) {
  const slices=school.turnos.filter(t=>!turno||t.turno===turno);
  if(!slices.length)return null;
  const result={...school,metrics:{},total:{t:0,e:0},em:{t:0,e:0},cursando:0,capacidade:0,etapas:''};
  const etapas=new Set();
  for(const t of slices){result.total.t+=t.total.t;result.total.e+=t.total.e;result.em.t+=t.em.t;result.em.e+=t.em.e;result.cursando+=t.cursando;result.capacidade+=t.capacidade;t.etapas.forEach(e=>etapas.add(e));for(const [k,v] of Object.entries(t.metrics)){if(!result.metrics[k])result.metrics[k]={t:0,e:0};result.metrics[k].t+=v.t;result.metrics[k].e+=v.e;}}
  result.etapas=[...etapas].join(' · ');result.disponivel=Math.max(0,result.capacidade-result.cursando);result.ocupacao=result.capacidade?100*result.cursando/result.capacidade:0;
  return result;
}

'use strict';const D=JSON.parse(document.getElementById('public-data').textContent);const fmt=new Intl.NumberFormat('pt-BR');const pct=x=>Number.isFinite(+x)?(+x).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%':'—';const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9]+/g,' ').trim();const fd=d=>{const a=String(d||'').split('-');return a.length===3?`${a[2]}/${a[1]}/${a[0]}`:d};

function bars(items,key='estudantes',label='escola',n=10){const a=[...items].sort((x,y)=>y[key]-x[key]).slice(0,n),mx=Math.max(1,...a.map(x=>x[key]));return a.map((x,i)=>`<div class="barrow"><span title="${esc(x[label])}">${i+1}. ${esc(String(x[label]).length>34?String(x[label]).slice(0,34)+'…':x[label])}</span><div class="bar"><i style="width:${100*x[key]/mx}%"></i></div><b class="num">${fmt.format(x[key])}</b></div>`).join('')}
function lineChart(hist){
  const pts=[...hist].filter(x=>x.totalE>0).sort((a,b)=>a.date.localeCompare(b.date));
  if(pts.length<2)return '<div class="muted">Histórico insuficiente.</div>';
  const W=Math.max(800,(pts.length-1)*72+80),H=220,p=40;
  const min=Math.min(...pts.map(x=>x.totalE)),max=Math.max(...pts.map(x=>x.totalE)),rg=Math.max(1,max-min);
  const c=pts.map((x,i)=>[p+i*(W-2*p)/(pts.length-1),H-p-(x.totalE-min)*(H-2*p)/rg]);
  const path=c.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
  return `<div class="chart history-chart"><svg viewBox="0 0 ${W} ${H}" style="min-width:${W}px" preserveAspectRatio="none" role="img" aria-label="Evolução do total de estudantes integrais, com valores em cada ponto"><line x1="${p}" y1="${H-p}" x2="${W-p}" y2="${H-p}" stroke="#ccd8d1"/><path d="${path}" fill="none" stroke="#1b7447" stroke-width="3" vector-effect="non-scaling-stroke"/>${c.map((q,i)=>`<g><circle cx="${q[0]}" cy="${q[1]}" r="4" fill="#1b7447"><title>${fd(pts[i].date)}: ${fmt.format(pts[i].totalE)}</title></circle><text class="point-value" x="${q[0]}" y="${q[1]-13}" text-anchor="middle" font-size="12" font-weight="700" fill="#135c37" stroke="#fbfdfc" stroke-width="3" paint-order="stroke fill">${fmt.format(pts[i].totalE)}</text></g>`).join('')}</svg></div><div class="chartlabels"><span>Mínimo: ${fmt.format(min)}</span><span>Máximo: ${fmt.format(max)}</span><span>Atual: ${fmt.format(pts.at(-1).totalE)}</span></div>`;
}
function renderDashboard(){const n=D.network,s=D.snapshot,j=D.jornada,schools=D.schools,regs=D.regionals;document.getElementById('p-dashboard').innerHTML=`<div class="kpis"><div class="kpi"><div class="lab">Matrículas na rede</div><div class="val">${fmt.format(n.estudantes)}</div><div class="sub">${fmt.format(n.escolas)} escolas no Mapa</div></div><div class="kpi"><div class="lab">Tempo integral</div><div class="val">${fmt.format(s.totalE)}</div><div class="sub">${pct(100*s.totalE/n.estudantes)} da rede</div></div><div class="kpi"><div class="lab">Turmas integrais</div><div class="val">${fmt.format(s.totalT)}</div><div class="sub">contagem direta</div></div><div class="kpi"><div class="lab">Vagas ETI</div><div class="val">${fmt.format(Math.max(0,n.integralCapacidade-n.integralEstudantes))}</div><div class="sub">ocupação ${pct(100*n.integralEstudantes/n.integralCapacidade)}</div></div><div class="kpi"><div class="lab">EPT integral</div><div class="val">${fmt.format(s.eptE)}</div><div class="sub">${fmt.format(s.eptT)} turmas</div></div><div class="kpi"><div class="lab">Jornada ampliada</div><div class="val">${fmt.format(j.estudantes)}</div><div class="sub">${fmt.format(j.turmas)} turmas · ${fmt.format(j.escolas)} escolas</div></div></div><div class="summary"><div><span class="muted">EF1 integral</span><b>${fmt.format(s.ef1E)}</b><span class="muted">${fmt.format(s.ef1T)} turmas</span></div><div><span class="muted">EF2 integral</span><b>${fmt.format(s.ef2E)}</b><span class="muted">${fmt.format(s.ef2T)} turmas</span></div><div><span class="muted">Ensino Médio</span><b>${fmt.format(s.emE)}</b><span class="muted">${fmt.format(s.emT)} turmas · inclui EPT</span></div><div><span class="muted">Escolas integrais</span><b>${fmt.format(n.integralEscolas)}</b><span class="muted">identificadas no mapa atual</span></div></div><div style="height:14px"></div><div class="grid2"><div class="card"><h3>Superintendências Regionais</h3><div class="tablewrap"><table><thead><tr><th>SRE</th><th class="num">Escolas</th><th class="num">Turmas</th><th class="num">ETI</th><th class="num">Ocupação</th><th class="num">Jornada</th></tr></thead><tbody>${regs.map(x=>`<tr><td><b>${esc(x.sre)}</b></td><td class="num">${fmt.format(x.escolas)}</td><td class="num">${fmt.format(x.turmas)}</td><td class="num">${fmt.format(x.estudantes)}</td><td class="num">${pct(x.ocupacao)}</td><td class="num">${fmt.format(x.jornada)}</td></tr>`).join('')}</tbody></table></div></div><div class="card"><h3>Maiores matrículas em tempo integral</h3>${bars(schools.map(x=>({...x,estudantes:x.total.e})),'estudantes','escola',10)}</div></div>`}
function selectedValues(id){const e=document.getElementById(id);return e?[...e.querySelectorAll('input[type="checkbox"]')].filter(c=>c.checked).map(c=>c.value):[]}
function multiSelect(id,label,items,defaults=[]){
  const options=items.map(x=>typeof x==='string'?{value:x,label:x}:x);
  return `<details class="multi-select" id="${id}" data-label="${esc(label)}"><summary><span class="multi-label">${esc(label)}</span><span class="multi-caption">${defaults.length?esc(options.find(o=>o.value===defaults[0])?.label||defaults[0]):'Todas as opções'}</span></summary><div class="multi-popup" role="group" aria-label="${esc(label)}"><input class="multi-search" type="search" aria-label="Buscar em ${esc(label)}" placeholder="Buscar opções…"><div class="multi-actions"><button type="button" data-multi-action="visible">Marcar visíveis</button><button type="button" data-multi-action="clear">Limpar filtro</button></div><p class="multi-hint">Sem opções marcadas = todas.</p><div class="multi-options">${options.map(o=>`<label class="multi-option"><input type="checkbox" value="${esc(o.value)}" ${defaults.includes(o.value)?'checked':''}><span>${esc(o.label)}</span></label>`).join('')}</div></div></details>`;
}
function updateMultiCaption(root){
  const options=[...root.querySelectorAll('input[type="checkbox"]')],chosen=options.filter(c=>c.checked),caption=root.querySelector('.multi-caption');
  if(!chosen.length||chosen.length===options.length)caption.textContent='Todas as opções';
  else if(chosen.length===1)caption.textContent=chosen[0].parentElement.querySelector('span').textContent;
  else caption.textContent=chosen.length+' selecionadas';
}
function setMultiValues(id,values){const root=document.getElementById(id);if(!root)return;root.querySelectorAll('input[type="checkbox"]').forEach(c=>c.checked=values.includes(c.value));updateMultiCaption(root)}
function wireMultis(prefix,draw,integralDefault=false){
  const area=document.getElementById(prefix+'-filters');
  area.querySelectorAll('.multi-select').forEach(root=>{
    updateMultiCaption(root);
    root.addEventListener('change',e=>{if(e.target.type==='checkbox'){updateMultiCaption(root);draw()}});
    root.querySelector('.multi-search').addEventListener('input',e=>{const q=norm(e.target.value);root.querySelectorAll('.multi-option').forEach(o=>o.hidden=!norm(o.textContent).includes(q))});
    root.querySelectorAll('[data-multi-action]').forEach(button=>button.addEventListener('click',()=>{const clear=button.dataset.multiAction==='clear';root.querySelectorAll('.multi-option').forEach(o=>{if(clear||!o.hidden)o.querySelector('input').checked=!clear});updateMultiCaption(root);draw()}));
    root.addEventListener('toggle',()=>{if(root.open)document.querySelectorAll('.multi-select[open]').forEach(other=>{if(other!==root)other.open=false})});
    root.addEventListener('keydown',e=>{if(e.key==='Escape'){root.open=false;root.querySelector('summary').focus()}});
  });
  document.getElementById(prefix+'-q').addEventListener('input',draw);
  document.getElementById(prefix+'-clear').addEventListener('click',()=>{
    document.getElementById(prefix+'-q').value='';
    area.querySelectorAll('.multi-select').forEach(root=>{setMultiValues(root.id,integralDefault&&root.id===prefix+'-turno'?['Integral']:[]);root.open=false;root.querySelector('.multi-search').value='';root.querySelectorAll('.multi-option').forEach(o=>o.hidden=false)});

}

function stageKeys(school){
  const keys=Object.keys(school.metrics||{}).filter(k=>(school.metrics[k]?.t||0)>0),text=norm(school.etapas),stages=new Set();
  if(keys.some(k=>k.startsWith('EF1_'))||/\bEF1\b|1 AO 5|ANOS INICIAIS/.test(text))stages.add('EF1');
  if(keys.some(k=>k.startsWith('EF2_'))||/\bEF2\b|6 AO 9|ANOS FINAIS/.test(text))stages.add('EF2');
  if(keys.some(k=>k.startsWith('EM_')||k.startsWith('EPT_'))||/\bEM\b|ENSINO MEDIO/.test(text))stages.add('EM');
  if(keys.some(k=>k.startsWith('EPT_'))||/ENSINO MEDIO INTEGRADO|CONCOMITANTE/.test(text))stages.add('EPT');
  if(/\bEJA\b|\bCEJA\b|JOVENS E ADULTOS/.test(text))stages.add('EJA');
  if(!stages.size)stages.add('OUTRAS');return [...stages];
}
function filterControls(prefix){
  const schools=D.networkSchools||D.schools,unique=key=>[...new Set(schools.map(s=>s[key]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
  const turns=[...new Set((D.networkSchools||[]).flatMap(s=>s.turnos.map(t=>t.turno)))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
  const stageLabels={EF1:'EF1 · Anos iniciais',EF2:'EF2 · Anos finais',EM:'EM · Ensino Médio',EPT:'EPT · Educação profissional',EJA:'EJA · Jovens e adultos',OUTRAS:'Outras etapas'};
  const stages=[...new Set(schools.flatMap(s=>stageKeys(s.turnos?selectSchoolTurn(s,''):s)))].map(k=>({value:k,label:stageLabels[k]||k}));
  return `<div class="filters filters-multi" id="${prefix}-filters"><input id="${prefix}-q" aria-label="Buscar escola" placeholder="Buscar escola, município ou INEP…">${multiSelect(prefix+'-sre','Regionais',unique('sre'))}${multiSelect(prefix+'-mun','Municípios',unique('municipio'))}${multiSelect(prefix+'-escola','Escolas',schools.map(s=>({value:String(s.inep),label:s.escola+' · '+s.municipio+' · '+s.inep})))}${multiSelect(prefix+'-turno','Turnos',turns,['Integral'])}${multiSelect(prefix+'-etapa','Etapas',stages)}<button class="clear" id="${prefix}-clear">Limpar</button></div><p class="muted filter-help">Marque quantas opções quiser. Dentro de cada filtro, basta corresponder a uma das opções; filtros diferentes são combinados. Etapas selecionam escolas que oferecem qualquer etapa marcada; os totais mantêm os turnos escolhidos. EPT integrado também faz parte do Ensino Médio.</p>`;
}
function selectedTurnSchools(prefix){
  const turns=selectedValues(prefix+'-turno');
  if(turns.length===1&&norm(turns[0])==='INTEGRAL')return D.schools;
  return (D.networkSchools||[]).map(s=>selectSchoolTurn(turns.length?{...s,turnos:s.turnos.filter(t=>turns.includes(t.turno))}:s,'')).filter(Boolean);
}
function schoolSelections(prefix){return Object.fromEntries(['sre','mun','escola'].map(k=>[k,new Set(selectedValues(prefix+'-'+k))]))}
function matchesSchoolFilters(school,prefix,selections=schoolSelections(prefix)){
  for(const [field,key] of [['sre','sre'],['mun','municipio'],['escola','inep']]){const selected=selections[field];if(selected.size&&!selected.has(String(school[key])))return false}return true;
}
function filtered(prefix){
  const q=norm(document.getElementById(prefix+'-q')?.value),stages=selectedValues(prefix+'-etapa'),selections=schoolSelections(prefix);
  return selectedTurnSchools(prefix).filter(s=>matchesSchoolFilters(s,prefix,selections)&&(!stages.length||stageKeys(s).some(k=>stages.includes(k)))&&(!q||norm([s.escola,s.municipio,s.inep].join(' ')).includes(q)));
}
function wire(prefix,draw){wireMultis(prefix,draw,true)}
function auxiliaryFilters(prefix,rows,withModels=false){
  const unique=key=>[...new Set(rows.map(s=>s[key]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
  const schools=[...new Map(rows.map(s=>[String(s.inep),{value:String(s.inep),label:s.escola+' · '+s.municipio+' · '+s.inep}])).values()];
  const turns=[...new Set(rows.flatMap(s=>withModels?(s.turmasDetalhadas||[]).map(t=>t.turno):[s.turno]).filter(Boolean))].sort();
  const models=[...new Set(rows.flatMap(s=>(s.turmasDetalhadas||[]).map(t=>t.modelo)))].sort();
  return `<div class="filters filters-multi" id="${prefix}-filters"><input id="${prefix}-q" aria-label="Buscar escola ou turma" placeholder="Buscar escola, município, turma ou modelo…">${multiSelect(prefix+'-sre','Regionais',unique('sre'))}${multiSelect(prefix+'-mun','Municípios',unique('municipio'))}${multiSelect(prefix+'-escola','Escolas',schools)}${multiSelect(prefix+'-turno','Turnos',turns)}${withModels?multiSelect(prefix+'-modelo','Modelos',models):''}<button class="clear" id="${prefix}-clear">Limpar</button></div>`;
}
function eptFilteredRows(){
  const q=norm(document.getElementById('ept-q')?.value),turns=selectedValues('ept-turno'),selections=schoolSelections('ept');
  return D.eptRows.filter(s=>matchesSchoolFilters(s,'ept',selections)&&(!turns.length||turns.includes(s.turno))&&(!q||norm([s.escola,s.municipio,s.turma,s.serie,s.composicao].join(' ')).includes(q)));
}
function jornadaFilteredSchools(){
  const q=norm(document.getElementById('jor-q')?.value),turns=selectedValues('jor-turno'),models=selectedValues('jor-modelo'),selections=schoolSelections('jor');
  return D.jornadaSchools.filter(s=>{
    if(!matchesSchoolFilters(s,'jor',selections))return false;
    const classes=s.turmasDetalhadas||[];
    if((turns.length||models.length)&&!classes.some(t=>(!turns.length||turns.includes(t.turno))&&(!models.length||models.includes(t.modelo))))return false;
    return !q||norm([s.escola,s.municipio,s.inep,...classes.flatMap(t=>[t.turma,t.modelo,t.turno])].join(' ')).includes(q);
  });
}
function filterDescription(prefix){
  const parts=[],q=document.getElementById(prefix+'-q')?.value;if(q)parts.push('Busca: '+q);
  for(const [key,label] of [['sre','Regionais'],['mun','Municípios'],['escola','Escolas'],['turno','Turnos'],['etapa','Etapas'],['modelo','Modelos']]){
    const root=document.getElementById(prefix+'-'+key);if(!root)continue;
    const labels=[...root.querySelectorAll('input[type="checkbox"]')].filter(c=>c.checked).map(c=>c.parentElement.querySelector('span').textContent);
    parts.push(label+': '+(labels.length?labels.join(', '):'Todas as opções'));
  }
  return parts.join(' · ');
}

function preparePrintReport(){
  let report=document.getElementById('print-report');
  if(!report){report=document.createElement('div');report.id='print-report';document.body.appendChild(report)}
  report.replaceChildren();
  const header=document.createElement('header');
  header.innerHTML=`<h1>Matrículas — Educação em Tempo Integral</h1><p>Rede Estadual do Tocantins · Atualização: ${esc(fd(D.updatedAt))}</p><p>Relatório completo das abas. As tabelas seguem os filtros selecionados no painel.</p>`;
  report.appendChild(header);
  for(const [id,title] of T){
    const source=document.getElementById('p-'+id),section=source.cloneNode(true);
    section.removeAttribute('id');section.className='print-section';
    section.querySelectorAll('[id]').forEach(e=>e.removeAttribute('id'));
    section.querySelectorAll('.filters,.mobile-note,.no-print,.filter-help').forEach(e=>e.remove());
    const prefix={escolas:'esc',enturmacao:'ent',ocupacao:'ocu',ept:'ept',jornada:'jor'}[id];
    if(prefix){
      const filters=filterDescription(prefix);
      const note=document.createElement('p');note.className='print-filter-note';note.textContent=filters;section.querySelector('.sectionhead')?.after(note);
    }
    section.querySelectorAll('table').forEach(table=>{
      const width=table.tHead?.rows[0]?.cells.length||0;
      if(width<=10)return;
      const blocks=document.createElement('div');
      for(let start=3;start<width;start+=7){
        const indices=[0,1,2,...Array.from({length:Math.min(7,width-start)},(_,i)=>start+i)],group=document.createElement('div');group.className='print-table-block';
        const caption=document.createElement('h3');caption.textContent=title+' — '+Array.from(table.tHead.rows[0].cells).slice(start,start+7).map(c=>c.textContent).join(' / ');group.appendChild(caption);
        const split=document.createElement('table');
        for(const part of [table.tHead,...table.tBodies]){const dest=document.createElement(part.tagName.toLowerCase());for(const row of part.rows){const tr=document.createElement('tr');for(const i of indices)tr.appendChild(row.cells[i].cloneNode(true));dest.appendChild(tr)}split.appendChild(dest)}
        group.appendChild(split);blocks.appendChild(group);
      }
      table.replaceWith(blocks);
    });
    report.appendChild(section);
  }
  return report;
}

  const ids=s=>[s.sre,s.municipio,String(s.inep),s.escola];

  const schoolRow=s=>[...ids(s),...fixed(s),s.total.t,s.total.e,s.capacidade,s.disponivel,s.ocupacao/100];
  const keys=[...new Set([...D.schools,...byTurn].flatMap(s=>Object.keys(s.metrics)))].sort();
  const metricName=k=>({EF1_4:'4º ano',EF1_5:'5º ano',EF2_6:'6º ano',EF2_7:'7º ano',EF2_8:'8º ano',EF2_9:'9º ano',EF2_FLUXO:'Avança EF2',EM_1:'1ª série',EM_2:'2ª série',EM_3:'3ª série',EM_FLUXO:'Avança EM',EPT_1:'1ª série EPT',EPT_2:'2ª série EPT',EPT_3:'3ª série EPT',OUTRAS:'Outras séries e modalidades'}[k]||k);
  const entHeaders=[...idLabels,'Turno',...profileLabels,...keys.flatMap(k=>[metricName(k)+' · Turmas',metricName(k)+' · Estudantes']),'Turmas EM','Estudantes EM','Total de turmas','Total de estudantes'];
  const entRow=(s,turno)=>[...ids(s),turno,...fixed(s),...keys.flatMap(k=>[s.metrics[k]?.t||0,s.metrics[k]?.e||0]),s.em.t,s.em.e,s.total.t,s.total.e];
  const sheets=[];
  const add=(name,headers,rows,percentColumns=[])=>sheets.push({name,headers,rows,percentColumns});
  const n=D.network,s=D.snapshot,j=D.jornada;
  add('Visão Geral',['Indicador','Valor','Data de atualização'],[
    ['Estudantes na rede',n.estudantes,D.updatedAt],['Escolas na rede',n.escolas,D.updatedAt],['Capacidade na rede',n.capacidade,D.updatedAt],
    ['Estudantes integrais',s.totalE,D.updatedAt],['Turmas integrais',s.totalT,D.updatedAt],['Escolas integrais',n.integralEscolas,D.updatedAt],['Capacidade integral',n.integralCapacidade,D.updatedAt],['Vagas integrais',Math.max(0,n.integralCapacidade-n.integralEstudantes),D.updatedAt],
    ['Estudantes EF1 integral',s.ef1E,D.updatedAt],['Turmas EF1 integral',s.ef1T,D.updatedAt],['Estudantes EF2 integral',s.ef2E,D.updatedAt],['Turmas EF2 integral',s.ef2T,D.updatedAt],['Estudantes EM integral (inclui EPT)',s.emE,D.updatedAt],['Turmas EM integral (inclui EPT)',s.emT,D.updatedAt],['Estudantes EPT integral',s.eptE,D.updatedAt],['Turmas EPT integral',s.eptT,D.updatedAt],
    ['Estudantes Jornada Ampliada',j.estudantes,D.updatedAt],['Turmas Jornada Ampliada',j.turmas,D.updatedAt],['Escolas Jornada Ampliada',j.escolas,D.updatedAt],['Capacidade Jornada Ampliada',j.capacidade,D.updatedAt]]);
  add('Escolas da Rede',schoolHeaders,all.map(schoolRow),[schoolHeaders.length-1]);
  add('Escolas Integrais',schoolHeaders,D.schools.map(schoolRow),[schoolHeaders.length-1]);
  add('Enturmação Integral',entHeaders,D.schools.map(x=>entRow(x,'Integral')));
  add('Enturmação por Turno',entHeaders,byTurn.map(x=>entRow(x,x.turno)));
  add('Ocupação por Turno',[...idLabels,'Turno','Turmas','Cursando','Capacidade','Vagas','Ocupação'],byTurn.map(x=>[...ids(x),x.turno,x.total.t,x.cursando,x.capacidade,x.disponivel,x.ocupacao/100]),[9]);
  add('EPT Cursos',[...idLabels,'Turma','Série','Composição','Turno','Cursando','Capacidade','Vagas'],D.eptRows.map(x=>[...ids(x),x.turma,x.serie,x.composicao,x.turno,x.cursando,x.capacidade,x.disponivel]));
  add('Jornada Ampliada',[...idLabels,'Turmas','Estudantes','Capacidade','Ocupação'],D.jornadaSchools.map(x=>[...ids(x),x.turmas,x.estudantes,x.capacidade,x.ocupacao/100]),[7]);
  add('Jornada por Turma',[...idLabels,'Turma','Turno','Modelo','Estudantes','Capacidade','Vagas','Ocupação'],D.jornadaSchools.flatMap(x=>(x.turmasDetalhadas||[]).map(t=>[...ids(x),t.turma,t.turno,t.modelo,t.estudantes,t.capacidade,t.disponivel,t.ocupacao/100])),[10]);
  add('Jornada por Modelo',[...idLabels,'Modelo','Turmas','Estudantes'],D.jornadaSchools.flatMap(x=>x.modelos.map(m=>[...ids(x),m.modelo,m.turmas,m.estudantes])));
  add('Regionais',['SRE','Escolas integrais','Turmas integrais','Estudantes integrais','Capacidade integral','Ocupação integral','Estudantes Jornada Ampliada'],D.regionals.map(x=>[x.sre,x.escolas,x.turmas,x.estudantes,x.capacidade,x.ocupacao/100,x.jornada]),[5]);
  add('Histórico',['Data','Origem','Turmas EF1','Estudantes EF1','Turmas EF2','Estudantes EF2','Turmas EPT','Estudantes EPT','Turmas EM (inclui EPT)','Estudantes EM (inclui EPT)','Total de turmas','Total de estudantes'],D.history.map(x=>[x.date,x.label,x.ef1T,x.ef1E,x.ef2T,x.ef2E,x.eptT,x.eptE,x.emT,x.emE,x.totalT,x.totalE]));
  add('Metodologia',['Informação','Descrição'],[
    ['Atualização',D.updatedAt],['Abrangência','Exportação completa dos dados do painel, independentemente dos filtros da tela.'],
    ['Dados fixos das escolas','Campos da Base completa de escolas integrais. Células vazias indicam informação não preenchida ou escola fora dessa base.'],
    ...Object.entries(D.methodology).map(([k,v])=>[({integral:'Tempo integral',ef1:'Ensino Fundamental I',ef2:'Ensino Fundamental II',em:'Ensino Médio',ept:'EPT',privacy:'Privacidade'}[k]||k),v]),
    ['EPT e Ensino Médio','Os totais de Ensino Médio já incluem EPT. Não somar EPT novamente ao total.'],
    ['Jornada Ampliada','Base complementar. Não somar automaticamente ao total da rede, pois pode incluir os mesmos estudantes.'],
    ['Turmas integrais não classificadas',D.validation.unknownTurmas],['Estudantes integrais não classificados',D.validation.unknownEstudantes]]);
  return sheets;
}

// XLSX is a ZIP of Open XML documents. Store entries without compression so
// export works locally, without a service, an external library or a network call.
function createExcelFile(sheets){
  const encoder=new TextEncoder(),xml=v=>String(v??'').replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g,'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
  const col=i=>{let s='';for(i++;i;i=Math.floor((i-1)/26))s=String.fromCharCode(65+(i-1)%26)+s;return s};
  const entries=[];const add=(name,content)=>entries.push({name:encoder.encode(name),bytes:encoder.encode(content)});
  const ns='http://schemas.openxmlformats.org/spreadsheetml/2006/main';
  add('[Content_Types].xml',`<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`);
  add('_rels/.rels','<?xml version="1.0"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>');
  add('xl/workbook.xml',`<?xml version="1.0" encoding="UTF-8"?><workbook xmlns="${ns}" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((s,i)=>`<sheet name="${xml(s.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>`);
  add('xl/_rels/workbook.xml.rels',`<?xml version="1.0"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((_,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`);
  add('xl/styles.xml',`<?xml version="1.0"?><styleSheet xmlns="${ns}"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF135C37"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyAlignment="1"><alignment vertical="center" wrapText="1"/></xf><xf numFmtId="10" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1" applyAlignment="1"><alignment vertical="top"/></xf></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`);
  sheets.forEach((sheet,i)=>{
    const rows=[sheet.headers,...sheet.rows],last=col(sheet.headers.length-1),range=`A1:${last}${rows.length}`;
    const columnWidths=sheet.headers.map((h,c)=>Math.min(60,Math.max(14,Math.max(h.length,...sheet.rows.map(r=>typeof r[c]==='string'?r[c].length:12))+2)));
    const widths=columnWidths.map((w,c)=>`<col min="${c+1}" max="${c+1}" width="${w}" customWidth="1"/>`).join('');
    const data=rows.map((row,r)=>{const lines=Math.max(1,...row.map((v,c)=>typeof v==='string'?v.split('\n').reduce((n,l)=>n+Math.max(1,Math.ceil(l.length/(columnWidths[c]-3))),0):1)),height=r===0?42:Math.min(409,Math.max(30,lines*16+6));return `<row r="${r+1}" ht="${height}" customHeight="1">${row.map((v,c)=>{const style=r===0?1:sheet.percentColumns.includes(c)?2:0,ref=col(c)+(r+1);if(v===null||v===undefined||v==='')return `<c r="${ref}" s="${style}"/>`;return typeof v==='number'&&Number.isFinite(v)?`<c r="${ref}" s="${style}"><v>${v}</v></c>`:`<c r="${ref}" s="${style}" t="inlineStr"><is><t xml:space="preserve">${xml(v)}</t></is></c>`}).join('')}</row>`}).join('');
    add(`xl/worksheets/sheet${i+1}.xml`,`<?xml version="1.0" encoding="UTF-8"?><worksheet xmlns="${ns}"><dimension ref="${range}"/><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><sheetFormatPr defaultRowHeight="30"/><cols>${widths}</cols><sheetData>${data}</sheetData><autoFilter ref="${range}"/><pageMargins left="0.3" right="0.3" top="0.4" bottom="0.4" header="0.2" footer="0.2"/></worksheet>`);
  });
  const crcTable=Array.from({length:256},(_,n)=>{for(let k=0;k<8;k++)n=n&1?0xedb88320^(n>>>1):n>>>1;return n>>>0});
  const crc=bytes=>{let n=0xffffffff;for(const b of bytes)n=crcTable[(n^b)&255]^(n>>>8);return (n^0xffffffff)>>>0};
  const parts=[],central=[];let offset=0,centralSize=0;
  for(const e of entries){const sum=crc(e.bytes),head=new Uint8Array(30+e.name.length),v=new DataView(head.buffer);v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint16(6,0x800,true);v.setUint32(14,sum,true);v.setUint32(18,e.bytes.length,true);v.setUint32(22,e.bytes.length,true);v.setUint16(26,e.name.length,true);head.set(e.name,30);parts.push(head,e.bytes);
    const c=new Uint8Array(46+e.name.length),w=new DataView(c.buffer);w.setUint32(0,0x02014b50,true);w.setUint16(4,20,true);w.setUint16(6,20,true);w.setUint16(8,0x800,true);w.setUint32(16,sum,true);w.setUint32(20,e.bytes.length,true);w.setUint32(24,e.bytes.length,true);w.setUint16(28,e.name.length,true);w.setUint32(42,offset,true);c.set(e.name,46);central.push(c);offset+=head.length+e.bytes.length;centralSize+=c.length;
  }
  const end=new Uint8Array(22),v=new DataView(end.buffer);v.setUint32(0,0x06054b50,true);v.setUint16(8,entries.length,true);v.setUint16(10,entries.length,true);v.setUint32(12,centralSize,true);v.setUint32(16,offset,true);
  return new Blob([...parts,...central,end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
function exportExcel(){
  try{const blob=createExcelFile(buildExcelSheets()),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`Painel_Matriculas_${D.updatedAt}.xlsx`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}catch(e){console.error(e);alert('Não foi possível exportar o Excel. Atualize a página e tente novamente.')}
}
